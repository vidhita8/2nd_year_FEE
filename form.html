<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Validation Form</title>
</head>
<body>
  <form>
    <label>Name:</label>
    <input type="text" pattern="{3,}" required>
      <br/>
      <label> Email:</label>
      <input type="email" required>
        <br/>
        <label>Age(between 18-60):</label>
        <input title="Atleast three character long" type='number' min=18 max=60 required>
          <br/>
          <label>Phone(10 digits):</label>
          <input type='number' required>
            <br/>
            <label> Password(6-12):</label>
            <input type='password' required>
              <br/>
              <label> Confirm password:</label>
            <input type='password' required>
              <br/> 
              <label>Gender:</label>
              <input type='radio' >
                <label> Male</label>
                <input type='radio' >
                <label> Female</label>
            <br/>
      <button>Submit</button>
  </body>
</html>
