<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Graphics</title>
<link rel="icon" href="favicon.png" type="image/png" />
</head>
<body>
<h1>HTMP graphics and Code Display Examples</h1>

<h2>1. SVG Graphics</h2>
<svg width="300" height="200">
    <circle cx="100" cy="100" r="80" fill="yellow" stroke="black" stroke-width="2" />
</svg>

<h2>Rectangle</h2>
<svg width="300" height="200">
    <rect x="30" y="30" width="200" height="80" fill="lightblue" stroke="black" stroke-width="2" />
</svg>

<h2>Ellipse</h2>
<svg width="300" height="200">
    <ellipse cx="130" cy="100" rx="100" ry="50" fill="green" stroke="black" stroke-width="2"/>
</svg>

<h2>Line</h2>
<svg width="300" height="210">
  <line x1="50" y1="50" x2="200" y2="200" stroke="red" stroke-width="9" />
</svg>

<h2>Polygon</h2>
<svg width="300" height="300">
  <polygon points="150,80 120,80, 90,70, 40, 200" fill="orange" stroke="black" stroke-width="2" />
</svg>

<h2>2. Static Image(img.tag)</h2>
<img src="img.jpg" alt="A sample image" width="300" height="200"/>

<h2>3. HTML Entities</h2>
<p>Less then: &lt;<br/>
Greater then: &gt; <br/>
Amperstand: &amp; <br/>
Double Quote: &quot;<br/>
</p>
<h2>4. Embedded YouTube Video</h2>

<iframe width="560" height="315"
  src="https://www.youtube.com/embed/dQw4w9WgXcQ"
  title="YouTube video player"
  frameborder="0"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
  allowfullscreen>
</iframe>
</body>
