<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basic Box Modal (No CSS File)</title>
</head>
<body style="margin:0; font-family:Arial, sans-serif; background-color:#f2f2f2;">

<!-- Overlay -->
<div style="position:fixed; top:0; left:0; width:100%; height:100%;
            background-color:rgba(0,0,0,0.5);
            display:flex; justify-content:center; align-items:center;">

    <!-- Modal Box -->
    <div style="background-color:white; width:350px;
                padding:20px; margin:15px;
                border-radius:10px;
                box-shadow:0 4px 8px rgba(0,0,0,0.2);">
        
        <h2>Modal Title</h2>
        <p>This is a basic modal with inline styles for padding and margins.</p>
        <button style="background-color:#3498db; color:white;
                       border:none; padding:8px 15px; margin-top:15px;
                       border-radius:5px; cursor:pointer;">
            Close
        </button>
    </div>
</div>

</body>
